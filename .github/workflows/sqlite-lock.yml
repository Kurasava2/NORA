name: Generate SQLite dependency lock

on:
  push:
    branches:
      - gsm-v155-sqlite-spike
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - name: Generate exact lock
        run: npm install --package-lock-only --ignore-scripts --save-exact sqlite3@5.1.7
      - name: Verify lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Upload package metadata
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-lockfiles
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7
