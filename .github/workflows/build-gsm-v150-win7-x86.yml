name: GSM v1.5.0 Win7 x86 build

on:
  push:
    branches:
      - gsm-v150-termux-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout exact v1.5.0 source
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Verify release metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($pkg.version -ne '1.5.0') { throw "Expected app 1.5.0, got $($pkg.version)" }
          if ($lock['version'] -ne '1.5.0') { throw "Expected lock 1.5.0, got $($lock['version'])" }
          if ($lock['packages']['']['version'] -ne '1.5.0') { throw "Expected root lock package 1.5.0, got $($lock['packages']['']['version'])" }
          if ($pkg.devDependencies.electron -ne '22.3.27') { throw "Electron must stay pinned to 22.3.27 for Windows 7" }
          if (Select-String -Path package.json -Pattern '@iarna/toml' -Quiet) { throw 'TOML dependency must not be present' }
          if (-not (Select-String -Path 'src/lib/domain.js' -Pattern 'STORAGE_VERSION = 9' -Quiet)) { throw 'Expected data schema 9' }

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Regression tests
        run: npm test

      - name: Production Vite build
        run: npm run build

      - name: Build portable Windows 7 x86
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win7:x86

      - name: Verify PE32 i386 and SHA-256
        shell: pwsh
        run: |
          $exe = Get-Item 'release/GSM-Vedomosti-1.5.0-portable-Win7-ia32.exe'
          $fs = [IO.File]::OpenRead($exe.FullName)
          $br = New-Object IO.BinaryReader($fs)
          $fs.Seek(0x3c, [IO.SeekOrigin]::Begin) | Out-Null
          $peOffset = $br.ReadInt32()
          $fs.Seek($peOffset + 4, [IO.SeekOrigin]::Begin) | Out-Null
          $machine = $br.ReadUInt16()
          $br.Close()
          $fs.Close()
          if ($machine -ne 0x014c) {
            throw ('Expected PE32/i386 0x014c, got 0x{0:X4}' -f $machine)
          }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii 'release/SHA256SUMS.txt'
          Write-Host "Verified PE32/i386: $($exe.Name)"
          Write-Host "SHA256: $hash"

      - name: Create clean v1.5.0 source ZIP
        shell: pwsh
        run: |
          $clean = Join-Path $env:RUNNER_TEMP 'GSM-v1.5.0-source'
          New-Item -ItemType Directory -Force $clean | Out-Null
          Get-ChildItem -Force | Where-Object {
            $_.Name -notin @('.git', '.github', 'node_modules', 'dist', 'release')
          } | ForEach-Object {
            Copy-Item $_.FullName -Destination $clean -Recurse -Force
          }
          Compress-Archive -Path "$clean/*" `
            -DestinationPath 'release/GSM_v1.5.0_Source_GitHub.zip' -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: GSM-Vedomosti-1.5.0-Win7-x86
          path: |
            release/GSM-Vedomosti-1.5.0-portable-Win7-ia32.exe
            release/SHA256SUMS.txt
            release/GSM_v1.5.0_Source_GitHub.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
