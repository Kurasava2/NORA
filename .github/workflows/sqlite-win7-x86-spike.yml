name: SQLite Win7 x86 compatibility spike

on:
  push:
    branches:
      - gsm-v155-sqlite-spike
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-ia32:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install exact project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install SQLite candidate as ia32
        shell: pwsh
        env:
          npm_config_arch: ia32
        run: npm install --no-save --no-audit --no-fund @vscode/sqlite3@5.1.14-vscode

      - name: Download Electron 22.3.27 ia32
        shell: pwsh
        run: |
          $zipPath = node -e "const { downloadArtifact } = require('@electron/get'); downloadArtifact({ version: '22.3.27', artifactName: 'electron', platform: 'win32', arch: 'ia32' }).then(path => process.stdout.write(path)).catch(error => { console.error(error); process.exit(1) })"
          if (-not (Test-Path $zipPath)) {
            throw "Electron ia32 archive not found: $zipPath"
          }
          $target = Join-Path $env:RUNNER_TEMP 'electron-22.3.27-ia32'
          New-Item -ItemType Directory -Force $target | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $target -Force
          "electronPath=$target\electron.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify Electron is ia32
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $arch = & $env:electronPath -p "process.arch"
          if ($arch.Trim() -ne 'ia32') {
            throw "Expected Electron process.arch=ia32, got $arch"
          }
          $version = & $env:electronPath -p "process.versions.electron"
          if ($version.Trim() -ne '22.3.27') {
            throw "Expected Electron 22.3.27, got $version"
          }

      - name: Verify SQLite native binary is PE32 i386
        shell: pwsh
        run: |
          $binary = Get-ChildItem 'node_modules/@vscode/sqlite3' -Recurse -Filter 'node_sqlite3.node' | Select-Object -First 1
          if (-not $binary) {
            throw 'node_sqlite3.node was not found'
          }

          $stream = [IO.File]::OpenRead($binary.FullName)
          $reader = New-Object IO.BinaryReader($stream)
          $stream.Seek(0x3c, [IO.SeekOrigin]::Begin) | Out-Null
          $peOffset = $reader.ReadInt32()
          $stream.Seek($peOffset + 4, [IO.SeekOrigin]::Begin) | Out-Null
          $machine = $reader.ReadUInt16()
          $reader.Close()
          $stream.Close()

          if ($machine -ne 0x014c) {
            throw ('Expected SQLite PE32/i386 machine 0x014c, got 0x{0:X4}' -f $machine)
          }

          Write-Host "SQLite binary: $($binary.FullName)"
          Write-Host ('PE machine: 0x{0:X4}' -f $machine)

      - name: Run SQLite inside Electron 22 x86
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          & $env:electronPath 'scripts/sqlite-spike.cjs'
          if ($LASTEXITCODE -ne 0) {
            throw "SQLite Electron probe failed with exit code $LASTEXITCODE"
          }
