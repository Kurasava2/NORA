name: SQLite Win7 x86 compatibility spike

on:
  push:
    branches:
      - gsm-v155-sqlite-spike
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-ia32:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install exact project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install sqlite3 5.1.7 ia32
        shell: pwsh
        env:
          npm_config_arch: ia32
        run: npm install --no-save --no-audit --no-fund sqlite3@5.1.7

      - name: Download Electron 22.3.27 ia32
        shell: pwsh
        run: |
          $zipPath = node -e "const { downloadArtifact } = require('@electron/get'); downloadArtifact({ version: '22.3.27', artifactName: 'electron', platform: 'win32', arch: 'ia32' }).then(path => process.stdout.write(path)).catch(error => { console.error(error); process.exit(1) })"
          if (-not (Test-Path $zipPath)) {
            throw "Electron ia32 archive not found: $zipPath"
          }
          $target = Join-Path $env:RUNNER_TEMP 'electron-22.3.27-ia32'
          New-Item -ItemType Directory -Force $target | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $target -Force
          "electronPath=$target\electron.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify Electron and SQLite are PE32 i386
        shell: pwsh
        run: |
          function Get-PeMachine([string]$Path) {
            $stream = [IO.File]::OpenRead($Path)
            $reader = New-Object IO.BinaryReader($stream)
            try {
              $stream.Seek(0x3c, [IO.SeekOrigin]::Begin) | Out-Null
              $peOffset = $reader.ReadInt32()
              $stream.Seek($peOffset + 4, [IO.SeekOrigin]::Begin) | Out-Null
              return $reader.ReadUInt16()
            } finally {
              $reader.Close()
              $stream.Close()
            }
          }

          $electronMachine = Get-PeMachine $env:electronPath
          if ($electronMachine -ne 0x014c) {
            throw ('Expected Electron PE32/i386 machine 0x014c, got 0x{0:X4}' -f $electronMachine)
          }

          $sqliteBinary = Get-ChildItem 'node_modules/sqlite3' -Recurse -Filter 'node_sqlite3.node' | Select-Object -First 1
          if (-not $sqliteBinary) {
            throw 'node_sqlite3.node was not found'
          }
          $sqliteMachine = Get-PeMachine $sqliteBinary.FullName
          if ($sqliteMachine -ne 0x014c) {
            throw ('Expected SQLite PE32/i386 machine 0x014c, got 0x{0:X4}' -f $sqliteMachine)
          }

          Write-Host ('Electron PE machine: 0x{0:X4}' -f $electronMachine)
          Write-Host ('SQLite PE machine: 0x{0:X4}' -f $sqliteMachine)
          Write-Host "SQLite binary: $($sqliteBinary.FullName)"

      - name: Run SQLite CRUD inside Electron 22 ia32
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'sqlite-spike-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'sqlite-spike-stderr.txt'
          $env:ELECTRON_RUN_AS_NODE = '1'
          $process = Start-Process -FilePath $env:electronPath -ArgumentList 'scripts/sqlite-spike.cjs' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($process.ExitCode -ne 0) {
            throw "SQLite Electron probe failed with exit code $($process.ExitCode)"
          }
          $result = Get-Content $stdout -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'SQLite probe did not report success' }
          if ($result.arch -ne 'ia32') { throw "Expected runtime arch ia32, got $($result.arch)" }
          if ($result.electron -ne '22.3.27') { throw "Expected Electron 22.3.27, got $($result.electron)" }
