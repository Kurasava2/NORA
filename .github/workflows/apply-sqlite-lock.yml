name: Apply SQLite dependency lock

on:
  push:
    branches:
      - gsm-v155-epui-sql-rewrite

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[sqlite-lock]') }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gsm-v155-epui-sql-rewrite
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - name: Generate exact npm metadata
        run: npm install --package-lock-only --ignore-scripts --save-exact sqlite3@5.1.7
      - name: Verify lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated metadata
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if (git diff --cached --quiet) {
            Write-Host 'SQLite dependency already applied.'
            exit 0
          }
          git commit -m 'Add sqlite3 5.1.7 dependency [sqlite-lock]'
          git push origin HEAD:gsm-v155-epui-sql-rewrite
