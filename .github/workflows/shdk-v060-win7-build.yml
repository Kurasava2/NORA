name: SHDK v0.6.0 Win7 x86

on:
  push:
    branches:
      - shdk-v060-win7-build
    paths:
      - '.github/workflows/shdk-v060-win7-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct verified source
        shell: powershell
        run: |
          $expected = @{
            "part00.txt" = "a86d089495a7d30e6fea8533b5b0de0c3652d6966b7363508ded901373cee19c"
            "part01.txt" = "f11ca19820d6a1599312136102c77370817095190352217cb34eeac3c3d82ef2"
            "part02.txt" = "2c3c523b1f16fccc7027685dad5393bd00dc1e4cec9f9901e38899de52412734"
            "part03.txt" = "fc70acc23a6158394695555483756a367384175cf192697a58cf8cab45a9a97f"
            "part04.txt" = "2d557792bfae0e1de4b2311154616b211f28d5e22308e9939183e7bb02da0e39"
            "part05.txt" = "360fca58495154599a1ad17f07fa2484e11529b807b7d4b9992a13717aa2ff0b"
            "part06.txt" = "de478371268b57f4874eff05aae3cddc5345970e33294b02d28d413bccd40ae2"
            "part07.txt" = "f714415492090141149a1423cefe0d9b6df1fea4a8c673ce20944a3c5d8f029b"
          }
          $parts = Get-ChildItem "shdk-build-payload-v2\part*.txt" | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 payload parts, got $($parts.Count)" }
          foreach ($part in $parts) {
            $hash = (Get-FileHash $part.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $expected[$part.Name]) { throw "Part hash mismatch: $($part.Name): $hash" }
            Write-Host "$($part.Name) OK $hash"
          }
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("payload.tar.xz", [Convert]::FromBase64String($base64))
          $payloadHash = (Get-FileHash "payload.tar.xz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($payloadHash -ne "79329bf0db97ceb95601db8d9d0f1694837a52367fd1c08928fece8cbdb19fce") { throw "Payload SHA256 mismatch: $payloadHash" }
          Write-Host "payload.tar.xz OK $payloadHash"
          tar -xJf payload.tar.xz
          if ($LASTEXITCODE -ne 0) { throw "tar extraction failed" }
          if (!(Test-Path "shdk-personnel-app-v0.6.0\package.json")) { throw "package.json missing" }
          if (!(Test-Path "shdk-personnel-app-v0.6.0\tsconfig.json")) { throw "tsconfig.json missing" }

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: shdk-personnel-app-v0.6.0
        run: npm install --include=optional

      - name: Typecheck
        working-directory: shdk-personnel-app-v0.6.0
        run: npm run typecheck

      - name: Tests
        working-directory: shdk-personnel-app-v0.6.0
        run: npm test

      - name: Rebuild RocksDB for Electron 22 x86
        working-directory: shdk-personnel-app-v0.6.0
        shell: cmd
        env:
          npm_config_target: 22.3.27
          npm_config_arch: ia32
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
        run: npm rebuild @salto-io/rocksdb --build-from-source

      - name: Build portable Win7 x86
        working-directory: shdk-personnel-app-v0.6.0
        run: npm run dist:win7:x86

      - name: Verify PE architecture and SHA256
        working-directory: shdk-personnel-app-v0.6.0
        shell: powershell
        run: |
          $exe = Get-Item "release\SHDK-Personnel-0.6.0-Win7-x86.exe"
          $bytes = [IO.File]::ReadAllBytes($exe.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x14c) { throw ("Expected x86 PE machine 0x14c, got 0x{0:X}" -f $machine) }
          Get-FileHash $exe.FullName -Algorithm SHA256

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: SHDK-Personnel-0.6.0-Win7-x86
          path: shdk-personnel-app-v0.6.0/release/SHDK-Personnel-0.6.0-Win7-x86.exe
          if-no-files-found: error
          retention-days: 30
