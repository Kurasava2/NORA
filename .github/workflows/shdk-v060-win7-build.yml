name: SHDK v0.7.0 Win7 x86 SQLite

on:
  push:
    branches:
      - shdk-v060-win7-build
    paths:
      - '.github/workflows/shdk-v060-win7-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct verified source
        shell: powershell
        run: |
          $expected = @{
            "part00.txt" = "f3e3a4b19aaca0d08949a694333062db6cbd0b94317e9b6f0ec24bba47526203"
            "part01.txt" = "bfa8e6e9c9a8726d9de97d2a10f54cb4f9ed71f09625cb16f457bb0b77bdda7b"
            "part02.txt" = "a84cc0cdd50f9009dc584bc572dea7236056dce01aa896b63955558b02af6faf"
            "part03.txt" = "629ff5d794a5d752f2032f00dc6748a81d6aa3e39cda3c8c8bf473e45ac57344"
            "part04.txt" = "18226b85b2aaa4b3555780119cefbd69b15b0771d87a7e3675f7223a033bd2f5"
            "part05.txt" = "925cdf7b61f4479c9ced3afae6a325fec19629d34b1108cedcb0096af484b414"
            "part06a.txt" = "e71fb3ab30c2f6de1d34026d4cbd871228059e80f92493e31b69a280277d3fe1"
            "part06b.txt" = "b7c9881ccac21d78220cba8c328b680f8137c7104827e150baf97bf94c913340"
            "part07.txt" = "17ec33015d4aedc158653c75dc274c186e8d558653bf29987b733162307cd499"
          }
          $names = @("part00.txt","part01.txt","part02.txt","part03.txt","part04.txt","part05.txt","part06a.txt","part06b.txt","part07.txt")
          $parts = @()
          foreach ($name in $names) {
            $part = Get-Item (Join-Path "shdk-build-payload-v2" $name)
            $hash = (Get-FileHash $part.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $expected[$name]) { throw "Part hash mismatch: ${name}: $hash" }
            Write-Host "$name OK $hash"
            $parts += $part
          }
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("payload.tar.xz", [Convert]::FromBase64String($base64))
          $payloadHash = (Get-FileHash "payload.tar.xz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($payloadHash -ne "79329bf0db97ceb95601db8d9d0f1694837a52367fd1c08928fece8cbdb19fce") { throw "Payload SHA256 mismatch: $payloadHash" }
          Write-Host "payload.tar.xz OK $payloadHash"
          tar -xJf payload.tar.xz
          if ($LASTEXITCODE -ne 0) { throw "tar extraction failed" }

      - name: Apply parser and SQLite patches
        shell: powershell
        run: |
          python shdk-build-overrides/patch_stroevaya.py
          python shdk-build-overrides/patch_sqlite.py

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: shdk-personnel-app-v0.6.0
        run: npm install

      - name: Verify RocksDB is gone
        working-directory: shdk-personnel-app-v0.6.0
        shell: powershell
        run: |
          if (Test-Path "node_modules\@salto-io\rocksdb") { throw "RocksDB dependency is still present" }
          if (!(Test-Path "node_modules\sql.js\dist\sql-asm.js")) { throw "sql.js asm build is missing" }
          Write-Host "SQLite/sql.js storage dependency OK; no RocksDB package installed."

      - name: Typecheck
        working-directory: shdk-personnel-app-v0.6.0
        run: npm run typecheck

      - name: Tests including SQLite persistence
        working-directory: shdk-personnel-app-v0.6.0
        run: npm test

      - name: Build portable Win7 x86
        working-directory: shdk-personnel-app-v0.6.0
        run: npm run dist:win7:x86

      - name: Runtime smoke test unpacked app
        working-directory: shdk-personnel-app-v0.6.0
        shell: powershell
        run: |
          $exe = Get-ChildItem "release\win-ia32-unpacked" -Filter "*.exe" | Where-Object { $_.Name -notmatch 'elevate|uninstall' } | Select-Object -First 1
          if (!$exe) { throw "Unpacked application EXE not found" }
          Write-Host "Launching $($exe.FullName)"
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--disable-gpu" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            Write-Host "Application exited early with code $($process.ExitCode)"
            Get-ChildItem $env:APPDATA -Recurse -Filter startup.log -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "---- $($_.FullName) ----"
              Get-Content $_.FullName -Raw
            }
            throw "Runtime smoke test failed: application exited during startup"
          }
          $db = Get-ChildItem $env:APPDATA -Recurse -Filter personnel.sqlite -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$db) { Stop-Process -Id $process.Id -Force; throw "Application stayed alive but personnel.sqlite was not created" }
          $header = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($db.FullName), 0, 15)
          if ($header -ne "SQLite format 3") { Stop-Process -Id $process.Id -Force; throw "Database is not a SQLite file: $header" }
          Write-Host "Runtime OK; SQLite database created at $($db.FullName)"
          Stop-Process -Id $process.Id -Force

      - name: Verify portable PE architecture and SHA256
        working-directory: shdk-personnel-app-v0.6.0
        shell: powershell
        run: |
          $exe = Get-Item "release\SHDK-Personnel-0.7.0-Win7-x86.exe"
          $bytes = [IO.File]::ReadAllBytes($exe.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x14c) { throw ("Expected x86 PE machine 0x14c, got 0x{0:X}" -f $machine) }
          Get-FileHash $exe.FullName -Algorithm SHA256

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: SHDK-Personnel-0.7.0-Win7-x86-SQLite
          path: shdk-personnel-app-v0.6.0/release/SHDK-Personnel-0.7.0-Win7-x86.exe
          if-no-files-found: error
          retention-days: 30
