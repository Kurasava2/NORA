name: Apply EP-UI dependency lock

on:
  push:
    branches:
      - gsm-v155-epui-sql-rewrite

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[epui-lock]') }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gsm-v155-epui-sql-rewrite
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - name: Add exact local EP-UI dependency
        shell: pwsh
        run: |
          npm pkg set "dependencies.@kurasava/ep-ui=file:vendor/ep-ui/kurasava-ep-ui-1.3.2.tgz"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exact install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify EP-UI version
        shell: pwsh
        run: |
          $version = node -p "require('./node_modules/@kurasava/ep-ui/package.json').version"
          if ($version.Trim() -ne '1.3.2') {
            throw "Expected EP-UI 1.3.2, got $version"
          }
      - name: Commit generated metadata
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'Add EP-UI 1.3.2 dependency [epui-lock]'
          git push origin HEAD:gsm-v155-epui-sql-rewrite
